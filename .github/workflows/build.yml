name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Code signing ──────────────────────────────────────────────────────
      # electron-builder automatically signs the Windows installer when these
      # env vars are present. They are read from GitHub repo Secrets, so the
      # build stays UNSIGNED (but succeeds) until you add the secrets.
      #
      # OV certificate (file-based .pfx, base64-encoded):
      #   CSC_LINK           = base64 of your .pfx   (see CODE-SIGNING.md)
      #   CSC_KEY_PASSWORD   = the .pfx password
      #
      # EV certificate (cloud HSM — e.g. Azure Trusted Signing / SSL.com eSigner):
      #   EV certs can no longer be exported as a .pfx file. Use a custom signing
      #   hook instead — see CODE-SIGNING.md → "EV / cloud HSM". Leave CSC_LINK
      #   unset in that case.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release
